# Dependabot PRs get no automatic code review (a `pull_request` run from
# dependabot[bot] carries no secrets), so `verify-verdict` stays red until a
# maintainer dispatches the review — see CONTRIBUTING.md ("Code review gate").
# Monthly + grouped keeps that to one PR per ecosystem per month.
version: 2
updates:
  # Python dependencies (root)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    target-branch: main
    groups:
      python-dependencies:
        patterns: ["*"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: main
    groups:
      github-actions:
        patterns: ["*"]
