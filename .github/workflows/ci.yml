name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # flutter-action brings no JDK of its own, and the Android Gradle Plugin
      # needs 17. `cache: gradle` keeps ~/.gradle across runs, which is what
      # stops every run from re-downloading the Gradle distribution.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test --coverage

      # The Kotlin half runs with the screen off and never reaches the Dart
      # tests, so it gets its own gate. `android/gradlew` is generated by
      # Flutter and gitignored, hence the config step first: `--config-only`
      # writes the wrapper and local.properties and stops there, seconds
      # instead of a whole debug APK.
      - run: flutter build apk --debug --config-only

      # `testDebugUnitTest` sits downstream of `compileFlutterBuildDebug`, so
      # this also builds the Dart kernel snapshot — a Dart error would surface
      # here too, though `flutter analyze` above catches it first.
      - run: ./gradlew --no-daemon :app:testDebugUnitTest
        working-directory: android

  pytest:
    # Python desktop port under like_spotify/. Runs on windows-latest, not
    # ubuntu: the host code (ctypes.windll single-instance guard, winreg
    # autostart toggle, winsound feedback) only executes on Win32. On Linux
    # those paths are reached only through monkeypatched test seams, so ubuntu
    # would validate the test doubles rather than the shipped behaviour — and
    # Win32 host code is exactly the regression surface this gate exists to
    # cover (cf. PR #47). The desktop port is Windows-only (see pyproject
    # classifiers), so CI runs on the platform it ships to.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install --upgrade pip

      # Runtime deps (requests/keyboard/pystray/Pillow) come from the package;
      # pyinstaller in the [dev] extra is a build-only tool, not needed here.
      - run: pip install . pytest pytest-asyncio

      - run: python -m pytest -q
