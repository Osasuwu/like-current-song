name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # flutter-action brings no JDK of its own, and the Android Gradle Plugin
      # needs 17. `cache: gradle` keeps ~/.gradle across runs, which is what
      # stops every run from re-downloading the Gradle distribution.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test --coverage

      # The Kotlin half runs with the screen off and never reaches the Dart
      # tests, so it gets its own gate. `android/gradlew` is generated by
      # Flutter and gitignored, hence the config step first: `--config-only`
      # writes the wrapper and local.properties and stops there, seconds
      # instead of a whole debug APK.
      - run: flutter build apk --debug --config-only

      # `testDebugUnitTest` sits downstream of `compileFlutterBuildDebug`, so
      # this also builds the Dart kernel snapshot — a Dart error would surface
      # here too, though `flutter analyze` above catches it first.
      - run: ./gradlew --no-daemon :app:testDebugUnitTest
        working-directory: android

  pytest:
    # Python desktop port under like_spotify/. Runs on windows-latest, not
    # ubuntu: the host code (ctypes.windll single-instance guard, winreg
    # autostart toggle, winsound feedback) only executes on Win32. On Linux
    # those paths are reached only through monkeypatched test seams, so ubuntu
    # would validate the test doubles rather than the shipped behaviour — and
    # Win32 host code is exactly the regression surface this gate exists to
    # cover (cf. PR #47). The desktop port is Windows-only (see pyproject
    # classifiers), so CI runs on the platform it ships to.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install --upgrade pip

      # Runtime deps (requests/keyboard/pystray/Pillow) come from the package;
      # pyinstaller in the [dev] extra is a build-only tool, not needed here.
      # pyyaml lets the workflow tests read .github/workflows/.
      - run: pip install . pytest pytest-asyncio pyyaml

      - run: python -m pytest -q

  exe:
    # The standalone LikeCurrentSong.exe (#214). Built on every PR so a
    # dependency bump that breaks the frozen app fails here, not on a user's
    # machine. `build_exe.py` runs the bundle check, which fails the build on
    # a bundled credential or a missing lazily-imported module.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install --upgrade pip

      - run: pip install -e .[dev,ytmusic]

      - run: python tools/build_exe.py

      # The exe is windowed, so PowerShell would return before it exits;
      # Start-Process -Wait is what surfaces its exit code. `--config` goes
      # through the real CLI; `--self-check` imports what the app loads
      # lazily (Settings window, SMTC, Tcl) and writes a traceback on failure.
      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $exe = "dist\LikeCurrentSong.exe"
          $p = Start-Process $exe -ArgumentList '--config' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--config exited $($p.ExitCode)" }
          $p = Start-Process $exe -ArgumentList '--self-check', 'self-check.txt' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path self-check.txt) { Get-Content self-check.txt }
            throw "--self-check exited $($p.ExitCode)"
          }
