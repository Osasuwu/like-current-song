name: like_spotify_mobile_app
description: "Like the currently playing track with headset button patterns, on Spotify or YouTube Music. Cross-device like counters, archive playlist management, best promotion."
publish_to: 'none'
version: 1.2.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  permission_handler: ^12.0.1
  connectivity_plus: ^6.1.5
  url_launcher: ^6.3.2
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.0
  collection: ^1.19.1
  crypto: ^3.0.6
  app_links: ^6.4.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
