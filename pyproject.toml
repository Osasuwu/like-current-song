[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "like-spotify"
version = "1.0.3"
description = "Like the currently playing Spotify song with a global hotkey (Windows tray, macOS/Linux CLI) - saves to Liked Songs without switching windows. Pluggable framework."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Osasuwu" }]
keywords = ["spotify", "hotkey", "global-hotkey", "keyboard-shortcut", "liked-songs", "like", "save-track", "tray", "spotify-api", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31",
    "keyboard>=0.13",
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyinstaller>=6.0",
]

[project.scripts]
like-spotify = "like_spotify.hosts:main"

[project.gui-scripts]
# Windowed-subsystem twin of `like-spotify`, for launches that must never
# show a console: the login autostart target and any external hotkey tool
# invoking `like-once`/`remove-once`. `--setup`/`--config` still need
# `like-spotify` (console) since they read from stdin.
like-spotify-gui = "like_spotify.hosts:main"

[project.urls]
Repository = "https://github.com/Osasuwu/like_spotify_mobile_app"
Issues    = "https://github.com/Osasuwu/like_spotify_mobile_app/issues"
Changelog = "https://github.com/Osasuwu/like_spotify_mobile_app/blob/main/CHANGELOG.md"
Contributing = "https://github.com/Osasuwu/like_spotify_mobile_app/blob/main/CONTRIBUTING.md"

[tool.setuptools.packages.find]
include = ["like_spotify*"]
exclude = ["tests*", ".venv-build*"]

[tool.setuptools.package-data]
"like_spotify.extensions.archive_remove" = ["manifest.json"]
"like_spotify.extensions.follow_artist" = ["manifest.json"]
"like_spotify.extensions.google_sheets_storage" = ["manifest.json"]
"like_spotify.extensions.like_cooldown" = ["manifest.json"]
"like_spotify.extensions.promote_to_best_of" = ["manifest.json"]
"like_spotify.extensions.one_shot_cli_trigger" = ["manifest.json"]
"like_spotify.extensions.spotify" = ["manifest.json"]
"like_spotify.extensions.supabase_storage" = ["manifest.json"]
"like_spotify.extensions.tray_hotkey_trigger" = ["manifest.json"]
"like_spotify.extensions.volume_button_trigger" = ["manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
