# No org.gradle.java.home here: it pins the build to one machine's JDK and
# breaks every other checkout. `flutter build` hands Gradle its own resolved
# JDK; a direct ./gradlew run uses JAVA_HOME. Put a local override in
# ~/.gradle/gradle.properties if you need one -- not in the repository.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
